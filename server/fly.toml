# fly.toml app configuration file generated for collaborative-markdown-editor on 2026-11-18T10:26:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'collaborative-markdown-editor'
primary_region = 'ams'

[build]
  [build.args]
    GO_VERSION = '1.27.4'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
