# fly.toml app configuration file generated for collaborative-markdown-editor on 2026-11-18T10:26:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'collaborative-markdown-editor'
primary_region = 'ams'

[build]
  [build.args]
    GO_VERSION = '1.27.4'

[env]
  PORT = '8080'
  # SQLite lives on the mounted volume below; the root filesystem is wiped on
  # every restart and deploy.
  DB_PATH = '/data/entries.db'
  # Hosts allowed to call the API and open websockets from another origin.
  ALLOWED_ORIGINS = 'mrkdwn-editor.netlify.app'

# Persistent storage for the database. Rooms live in one process's memory, so
# run exactly one machine (a volume can only be attached to one machine anyway).
[mounts]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
